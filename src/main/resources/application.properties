spring.application.name=StudyOS

# H2 Database - file based, no install needed
spring.datasource.url=jdbc:h2:file:./data/studyosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# File upload limits (for PDF notes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Groq API config (free tier, OpenAI-compatible) ----
# Set your key as an environment variable named GROQ_API_KEY (never hardcode it in this file).
groq.api.key=${GROQ_API_KEY:}
groq.api.model=llama-3.3-70b-versatile
groq.api.url=https://api.groq.com/openai/v1/chat/completions

# Spaced repetition intervals (in days) after 1st, 2nd, 3rd... correct answers in a row
studyos.spaced-repetition.intervals=1,3,7,14,30
